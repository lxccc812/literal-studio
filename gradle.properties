pluginVersion=0.1.0
platformVersion=2026.2.0.1
pluginSinceBuild=262
pluginUntilBuild=262.*

# 限制容器构建内存和并发，避免首次下载 SDK 时同时启动多个高内存进程。
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# 插件运行时使用 IDE 自带的 Kotlin 标准库，禁止重复打包另一份标准库。
kotlin.stdlib.default.dependency=false
kotlin.compiler.execution.strategy=in-process

# JDK 由 Docker 镜像提供，不允许 Gradle 自动下载另一套开发环境。
org.gradle.java.installations.auto-download=false
